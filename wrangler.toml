# ============================================================
# DEPLOYMENT CHECKLIST — run these steps before `wrangler deploy`
#
# Step 1: Create the KV namespace
#   wrangler kv namespace create KKME_SIGNALS
#   (note the returned `id`)
#
#   wrangler kv namespace create KKME_SIGNALS --preview
#   (note the returned `id` for preview_id below)
#
# Step 2: Paste both IDs into [[kv_namespaces]] below,
#   replacing REPLACE_WITH_KV_NAMESPACE_ID
#   and REPLACE_WITH_KV_PREVIEW_ID
#
# Step 3: Set API key secrets (never put keys in this file)
#   wrangler secret put ENTSOE_API_KEY
#   wrangler secret put UPDATE_SECRET      ← used by GitHub Action POST /s2/update
#   (also add UPDATE_SECRET to GitHub repo secrets — must match)
#
# Step 4: Deploy
#   wrangler deploy
# ============================================================

name = "kkme-fetch-s1"
main = "workers/fetch-s1.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

# Phase 38.1 — Workers Logs. The S1 branch failed on 8 consecutive 4-hourly
# ticks between 2026-08-01T00:01Z and 2026-08-02T08:00Z, and intermittently for
# at least the preceding week, writing console.error into a worker with no log
# sink configured. Every `console.error` in the cron handler was therefore
# addressed to nobody. Diagnosis had to be reconstructed from `raw:s1:<date>`
# KV TTL arithmetic after the fact. head_sampling_rate = 1 keeps every
# invocation; this worker serves a low-traffic site, so the volume is not a
# concern and losing the one failing tick in a sample would be.
[observability]
enabled = true
head_sampling_rate = 1

# Phase 53 — the hourly leg moved 0 -> 5 past the hour.
#
# Both crons fired in the same second at every 4h-aligned hour, and they overlap
# in work: the hourly refreshes s8 / gen / genload, all three of which the
# 4-hourly block also refreshes. So six times a day the worker ran the same three
# legs twice concurrently, competing for one invocation's connection budget —
# that is the collision behind the `[Gen/LT] energy-charts HTTP 429` recorded in
# the 2026-08-02T12:00:33Z tick.
#
# Staggering rather than skipping at `hour % 4 == 0` keeps the hourly backstop:
# if the 4-hourly tick fails, the hourly one still refreshes the time-sensitive
# signals five minutes later, which a skip would have given up. Five minutes is
# past the observed tail of the 4-hourly block (wall=50 s at its worst).
[triggers]
crons = [
  "0 */4 * * *",    # Every 4h: all signals (S1-S9 + Euribor + gen/load)
  "5 * * * *",      # Hourly at :05: time-sensitive only (genload, S8, wind, solar, load)
  "30 9 * * *",     # 09:30 UTC daily: S2 watchdog
  "0 8 * * *",      # 08:00 UTC daily: daily digest to Telegram
  "30 7 * * 1",     # Mondays 07:30 UTC: weekly fleet-lifecycle digest (37.B.1)
]

[[kv_namespaces]]
binding = "KKME_SIGNALS"
id = "323b493a50764b24b88a8b4a5687a24b"
preview_id = "5f2356e7c25b44538e4bcfbe2a5de0ca"
